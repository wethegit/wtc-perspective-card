# Builds the demo (against the workspace library source, so it always shows
# the library as of the deployed commit) and publishes it to GitHub Pages.
name: Deploy demo

on:
  push:
    branches:
      - master
    paths:
      - demo/**
      - packages/wtc-perspective-card/**
  # Manual deploys - e.g. the first one, before any qualifying push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Enables Pages (source: GitHub Actions) on first run and exposes the
      # site's base path for the build.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm install --frozen-lockfile

      # A project page is served at /<repo>/ rather than the domain root, so
      # the build needs the matching base path. Passed on the command line so
      # local dev and preview keep the default '/'.
      - name: Build demo
        run: pnpm --filter demo build --base=${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
