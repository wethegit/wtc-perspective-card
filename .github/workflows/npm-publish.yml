# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Publish NPM

on:
  push:
    branches:
      - master
    paths:
      - src/**

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/

      - run: npm install
      # Publish prereleases (e.g. 3.0.0-beta.0) under their own dist-tag (beta)
      # instead of `latest`, so `npm install <pkg>` keeps returning the last
      # stable. Stable versions (no prerelease suffix) resolve to `latest`.
      - name: Resolve dist-tag from version
        id: disttag
        run: echo "tag=$(node -p "(require('./package.json').version.split('-')[1]||'latest').split('.')[0]")" >> "$GITHUB_OUTPUT"
      - run: npm publish --access public --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
