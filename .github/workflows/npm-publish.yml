# Publishes the library package to npm when its source changes on master.
name: Publish NPM

on:
  push:
    branches:
      - master
    paths:
      - packages/wtc-perspective-card/**

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Publish prereleases (e.g. 3.0.0-beta.0) under their own dist-tag (beta)
      # instead of `latest`, so `npm install <pkg>` keeps returning the last
      # stable. Stable versions (no prerelease suffix) resolve to `latest`.
      - name: Resolve dist-tag from version
        id: disttag
        run: echo "tag=$(node -p "(require('./packages/wtc-perspective-card/package.json').version.split('-')[1]||'latest').split('.')[0]")" >> "$GITHUB_OUTPUT"

      # prepublishOnly builds dist; --no-git-checks is needed because
      # actions/checkout leaves a detached HEAD, which pnpm's git checks reject.
      - name: Publish
        run: pnpm --filter wtc-perspective-card publish --access public --tag ${{ steps.disttag.outputs.tag }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
